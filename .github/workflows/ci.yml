name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (with file-format extras so their tests run)
        run: |
          pip install -e ".[pdf,docx]"
          pip install -r requirements-dev.txt
      - name: Run tests (offline — no API keys needed)
        run: pytest -q
      - name: Packaging smoke (console entry points)
        run: |
          loci --help
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' | loci-mcp | grep serverInfo

  eval:
    name: retrieval regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The gate refuses to run without a committed baseline: a deleted
      # baseline must break the build, not silently disarm it. When missing,
      # this job generates one, uploads it as an artifact, and fails — the
      # committer lands the file and the next run gates for real.
      - name: Recall@k over the fixed eval set
        run: |
          if [ ! -f scripts/eval_retrieval.baseline.json ]; then
            echo "::error::baseline missing - generating one; commit the artifact as scripts/eval_retrieval.baseline.json"
            python scripts/eval_retrieval.py --update-baseline
            cat scripts/eval_retrieval.baseline.json
            exit 1
          fi
          python scripts/eval_retrieval.py
      - name: Upload generated baseline (first run only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-baseline
          path: scripts/eval_retrieval.baseline.json
          if-no-files-found: ignore

  native:
    name: native (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Test the native core and MCP server
        working-directory: native
        run: cargo test --offline --locked || cargo test --locked
      - name: Clippy (warnings are not fatal, but they are visible)
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings
      - name: MCP smoke (initialize + tools/list over stdio)
        working-directory: native
        run: |
          cargo build --release -p loci-cli
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | ./target/release/loci-mcp --config /dev/null \
            | tee /dev/stderr | grep -q brain_search

  desktop:
    name: desktop shell (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # macOS needs no extra system packages for Tauri; Linux would require the
      # gtk/webkit dev libraries, so the shell build is macOS-only for now
      - name: Build the desktop shell
        working-directory: native
        run: cargo build --release -p loci-desktop
