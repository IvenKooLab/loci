[package]
name = "loci-desktop"
version = "0.1.0"
edition = "2021"
description = "loci desktop shell — the console in a native window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
loci-core = { path = "../../crates/loci-core" }
loci-cli = { path = "../../crates/loci-cli" }
