[workspace]
resolver = "2"
members = ["crates/loci-core", "crates/loci-cli", "desktop/src-tauri"]
# `cargo test` / `cargo clippy` in native/ build core + cli only: the desktop
# crate pulls Tauri, which on Linux needs GTK/webkit system packages that a
# bare CI runner does not have. The desktop build runs on macOS (its native
# target needs no system packages) — see the desktop job in ci.yml.
default-members = ["crates/loci-core", "crates/loci-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha1 = "0.10"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
