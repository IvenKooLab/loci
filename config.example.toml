# ==== Copy to config.toml and fill in your values ====
#
# Any OpenAI-compatible endpoint works. llm and embed can use different
# providers (e.g. chat via DeepSeek, embeddings via OpenAI). Pick yours:
#
#   OpenAI      base_url https://api.openai.com/v1
#               chat gpt-4o-mini · embeddings text-embedding-3-small
#   Zhipu (GLM) base_url https://open.bigmodel.cn/api/paas/v4
#               chat glm-4.6 · embeddings embedding-3
#   DeepSeek    base_url https://api.deepseek.com
#               chat deepseek-chat · no /embeddings API — pair [embed]
#               with another provider
#   Kimi        base_url https://api.moonshot.cn/v1
#               chat kimi-k2 · no /embeddings API — pair [embed] with
#               another provider
#   Ollama      base_url http://localhost:11434/v1   (100% local & offline)
#               chat llama3.1 / qwen2.5:7b · embeddings nomic-embed-text
#               any api_key value is accepted
#
# Switching the embedding model/provider later? Vectors from different models
# don't mix: re-run `loci ingest --force` to rebuild the index.

[llm]
base_url = "https://api.openai.com/v1"
api_key = "your-api-key-here"          # or set the env var BRAIN_LLM_API_KEY
model = "gpt-4o-mini"                  # chat model

[embed]
base_url = "https://api.openai.com/v1"
api_key = "your-api-key-here"          # or set the env var BRAIN_EMBED_API_KEY
model = "text-embedding-3-small"       # embedding model

# Directories to index (scanned recursively: .md / .txt, plus .pdf and .docx
# when the matching optional extras are installed)
[[sources]]
path = "D:/notes"                                    # change to your directory
# chunk_size = 1200                                  # optional per-directory override
# chunk_overlap = 150                                # (0 is honored — no overlap)

# [[sources]]
# path = "C:/Users/me/Documents/project-docs"       # uses the global [chunk] defaults

[chunk]
size = 800        # target chunk length (characters)
overlap = 100     # overlap between neighboring chunks

[top_k]
search = 5        # number of hits per search

[retrieval]
hybrid = true     # fuse vector search with BM25 (Reciprocal Rank Fusion)
rrf_k = 60        # RRF smoothing constant; higher = flatter fusion weights

[watch]
interval = 30     # seconds between scans in `watch` mode

[store]
path = "./chroma_db"   # where the vector store lives on disk
