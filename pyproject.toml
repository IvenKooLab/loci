[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loci-rag"
version = "0.8.1"
description = "A local 'second brain': RAG over your scattered notes and docs, with an MCP server so AI agents can use it too."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IvenKooLab" }]
keywords = ["rag", "loci", "mcp", "obsidian", "chromadb", "local-first", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "openai>=1.50",
    "chromadb>=0.5",
]

[project.optional-dependencies]
# pymupdf4llm 2.0 (2026-10-19) is a 904-byte stub with no metadata and no
# dependency on pymupdf, so `loci-rag[pdf]` installed a PDF reader that
# could not read a PDF. Cap below it, and depend on pymupdf directly —
# pymupdf4llm's table extraction and our tests both import it.
pdf = ["pymupdf4llm>=0.0.21,<2", "pymupdf>=1.26.6", "pypdf>=4"]
ocr = ["rapidocr-onnxruntime>=1.3"]
docx = ["python-docx>=1.1"]
rerank = ["sentence-transformers>=3"]
zh = ["jieba>=0.42"]
dev = ["pytest>=8"]

[project.scripts]
loci = "loci.cli:main"
loci-mcp = "loci.mcp_server:serve"

[project.urls]
Homepage = "https://github.com/IvenKooLab/loci"
Changelog = "https://github.com/IvenKooLab/loci/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/IvenKooLab/loci/blob/main/docs/roadmap.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# demo_notes ships the sample corpus behind `loci demo`; the per-level globs
# cover projects/<name>/meetings/*.md without shipping __pycache__ or tests
loci = ["web/*", "demo_notes/*.md", "demo_notes/*/*.md",
        "demo_notes/*/*/*.md", "demo_notes/*/*/*/*.md"]
